<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-switch">
      <span class="switch-icon">🌙</span>
      <label class="switch" for="theme-toggle">
        <input type="checkbox" id="theme-toggle" />
        <span class="switch-slider"></span>
      </label>
      <span class="switch-icon">☀️</span>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="overlay-box pause-box">
        <!-- Vista principal del menú de pausa -->
        <div id="pause-main">
          <p class="pause-title">PAUSA</p>
          <button class="pause-btn" id="resume-btn">Reanudar</button>
          <button class="pause-btn" id="pause-restart-btn">Reiniciar</button>
          <button class="pause-btn" id="controls-btn">Ver controles</button>
          <div class="pause-level">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-selector">
              <button class="level-step" id="level-minus" type="button">−</button>
              <input type="number" id="start-level" min="1" max="20" value="1" />
              <button class="level-step" id="level-plus" type="button">+</button>
            </div>
          </div>
        </div>

        <!-- Sub-vista: lista de controles -->
        <div id="pause-controls" class="hidden">
          <p class="pause-title">CONTROLES</p>
          <ul class="pause-controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
          <button class="pause-btn" id="controls-back-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
